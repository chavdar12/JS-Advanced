name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Test every lesson on its own
        run: for lesson in [0-9][0-9][0-9]-*/; do (cd "$lesson" && npm ci && npm test) || exit 1; done
